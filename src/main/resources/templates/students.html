<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="topbar">
    <div class="brand">University Management</div>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/students}">Students</a>
        <a th:href="@{/teachers}">Teachers</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

<main class="container">
    <h2>Students</h2>

    <div class="panel-grid">
        <div class="panel">
            <h3>Add Student</h3>
            <form th:action="@{/students}" method="post" th:object="${student}">
                <label>Name</label>
                <input type="text" th:field="*{name}" required>

                <label>Email</label>
                <input type="email" th:field="*{email}" required>

                <label>Program</label>
                <input type="text" th:field="*{program}" required>

                <label>Year</label>
                <input type="number" th:field="*{year}" min="1" max="8" required>

                <label>Status</label>
                <input type="text" th:field="*{status}" required>

                <button type="submit">Save Student</button>
            </form>
        </div>

        <div class="panel table-panel">
            <h3>Student List</h3>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Program</th>
                    <th>Year</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.program}"></td>
                    <td th:text="${student.year}"></td>
                    <td th:text="${student.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
