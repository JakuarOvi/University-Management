<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Management Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="login-box">
    <h1>University Management</h1>
    <p class="subtitle">Admin Portal</p>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/login}" method="post" th:object="${loginForm}">
        <label for="username">Username</label>
        <input id="username" type="text" th:field="*{username}" placeholder="admin" required>

        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" placeholder="admin123" required>

        <button type="submit">Login</button>
    </form>

    <p class="demo-note">Demo credentials: admin / admin123</p>
</div>
</body>
</html>
